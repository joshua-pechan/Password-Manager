<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span class="header-title">Password Manager</span>
  </header>

  <!-- ── Tab bar ── -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="main">Logins</button>
    <button class="tab"        data-tab="gen">Generator</button>
    <button class="tab"        data-tab="settings">Settings</button>
  </nav>

  <!-- ── Logins tab ── -->
  <div id="view-main" class="view">
    <div id="status-bar" class="status"></div>
    <div id="cred-list"></div>
    <p id="no-creds" class="empty hidden">No saved logins for this site.</p>
  </div>

  <!-- ── Generator tab ── -->
  <div id="view-gen" class="view hidden">
    <div class="gen-body">

      <div class="gen-output-row">
        <input id="gen-output" type="text" class="gen-output" readonly
               placeholder="Click Generate…" spellcheck="false">
        <button id="btn-copy-gen" class="icon-btn" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <p id="gen-copied" class="hint ok hidden">Copied!</p>

      <div class="gen-row">
        <label for="gen-length">Length</label>
        <div class="slider-row">
          <input id="gen-length" type="range" min="8" max="20" value="20">
          <span id="gen-length-val">20</span>
        </div>
      </div>

      <div class="gen-checks">
        <label class="check-row"><input type="checkbox" id="opt-upper"   checked> Uppercase  (A–Z)</label>
        <label class="check-row"><input type="checkbox" id="opt-lower"   checked> Lowercase  (a–z)</label>
        <label class="check-row"><input type="checkbox" id="opt-digits"  checked> Numbers    (0–9)</label>
        <label class="check-row"><input type="checkbox" id="opt-symbols" checked> Symbols    (!@#…)</label>
      </div>

      <div class="strength-row">
        <div class="gen-strength" id="gen-strength"></div>
        <span id="gen-strength-label" class="strength-label"></span>
      </div>

      <button id="btn-generate" class="primary-btn">Generate</button>
    </div>
  </div>

  <!-- ── Settings tab ── -->
  <div id="view-settings" class="view hidden">
    <div class="settings-body">
      <label for="key-input">API Key</label>
      <p class="hint">
        Open the desktop app &rarr; click <strong>Info</strong>
        &rarr; copy the API key and paste it below.
      </p>
      <textarea id="key-input" placeholder="Paste API key here" rows="3" spellcheck="false"></textarea>
      <button id="btn-save-key" class="primary-btn">Save Key</button>
      <p id="key-msg" class="hint"></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
